<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Instrumento de auditoría de confidencialidad ISO/IEC 27001:2022 para bases Oracle." />
    <title>Auditor ISO 27001 · Confidencialidad en Oracle</title>
    <script>
      // Aplica el tema antes de pintar para evitar un destello del tema equivocado.
      (function () {
        var preferido = "sistema";
        try {
          preferido = localStorage.getItem("tema") || "sistema";
        } catch (e) {}
        var oscuro = preferido === "oscuro" || (preferido === "sistema" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = oscuro ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
